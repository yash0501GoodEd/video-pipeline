<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" fill="none">
  <rect width="900" height="500" rx="20" fill="#0d1b2a"/>

  <!-- Red light side -->
  <g transform="translate(50, 60)">
    <rect width="350" height="380" rx="16" fill="#1a0000" stroke="#f4433640" stroke-width="2"/>
    <text x="175" y="40" text-anchor="middle" fill="#ef5350" font-family="sans-serif" font-size="22" font-weight="700">RED LIGHT</text>
    <text x="175" y="65" text-anchor="middle" fill="#ef9a9a" font-family="sans-serif" font-size="13">Low frequency, high intensity</text>
    <!-- Many weak bullets -->
    <g opacity="0.5">
      <circle cx="80" cy="150" r="8" fill="#ef5350"/>
      <circle cx="130" cy="130" r="8" fill="#ef5350"/>
      <circle cx="180" cy="170" r="8" fill="#ef5350"/>
      <circle cx="230" cy="140" r="8" fill="#ef5350"/>
      <circle cx="280" cy="160" r="8" fill="#ef5350"/>
      <circle cx="100" cy="200" r="8" fill="#ef5350"/>
      <circle cx="200" cy="220" r="8" fill="#ef5350"/>
      <circle cx="260" cy="210" r="8" fill="#ef5350"/>
    </g>
    <!-- Metal - no ejection -->
    <rect x="60" y="270" width="230" height="60" rx="8" fill="#37474f" stroke="#78909c" stroke-width="1"/>
    <text x="175" y="305" text-anchor="middle" fill="#b0bec5" font-family="sans-serif" font-size="14">No electron ejected ❌</text>
    <text x="175" y="360" text-anchor="middle" fill="#ef9a9a" font-family="sans-serif" font-size="12">Each bullet too weak</text>
  </g>

  <!-- Violet light side -->
  <g transform="translate(500, 60)">
    <rect width="350" height="380" rx="16" fill="#0a001a" stroke="#7c4dff40" stroke-width="2"/>
    <text x="175" y="40" text-anchor="middle" fill="#b388ff" font-family="sans-serif" font-size="22" font-weight="700">VIOLET LIGHT</text>
    <text x="175" y="65" text-anchor="middle" fill="#ce93d8" font-family="sans-serif" font-size="13">High frequency, low intensity</text>
    <!-- Few strong bullets -->
    <g opacity="0.9">
      <circle cx="120" cy="150" r="16" fill="#7c4dff"/>
      <text x="120" y="155" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">hν</text>
      <circle cx="230" cy="170" r="16" fill="#7c4dff"/>
      <text x="230" y="175" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">hν</text>
    </g>
    <!-- Metal - ejection! -->
    <rect x="60" y="270" width="230" height="60" rx="8" fill="#37474f" stroke="#69f0ae" stroke-width="2"/>
    <text x="175" y="305" text-anchor="middle" fill="#69f0ae" font-family="sans-serif" font-size="14">Electron ejected! ✅</text>
    <circle cx="175" cy="240" r="8" fill="#69f0ae" opacity="0.8"/>
    <line x1="175" y1="240" x2="175" y2="200" stroke="#69f0ae" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="175" y="360" text-anchor="middle" fill="#a5d6a7" font-family="sans-serif" font-size="12">One bullet is enough!</text>
  </g>

  <!-- VS -->
  <text x="450" y="260" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="800" opacity="0.6">VS</text>
</svg>
