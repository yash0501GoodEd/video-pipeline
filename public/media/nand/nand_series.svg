<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <!-- GATE 1: NAND -->
  <line x1="10" y1="70" x2="60" y2="70" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <line x1="10" y1="130" x2="60" y2="130" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <path d="M60,40 L120,40 C180,40 180,160 120,160 L60,160 Z" fill="none" stroke="white" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="192" cy="100" r="12" fill="none" stroke="white" stroke-width="6"/> <!-- Bubble 1 -->
  
  <!-- CONNECTION (with logic label) -->
  <line x1="204" y1="100" x2="310" y2="100" stroke="white" stroke-width="6" stroke-dasharray="8,5"/>
  <text x="210" y="85" fill="#facc15" font-family="Arial" font-size="18">Inverted</text>
  
  <!-- GATE 2: NAND (as NOT) -->
  <path d="M310,40 L370,40 C430,40 430,160 370,160 L310,160 Z" fill="none" stroke="white" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="442" cy="100" r="12" fill="white" stroke="white" stroke-width="6"/> <!-- Bubble 2 (filled to show interaction) -->
  
  <!-- FINAL OUTPUT -->
  <line x1="454" y1="100" x2="580" y2="100" stroke="#00ff00" stroke-width="8" stroke-linecap="round"/>
  <text x="470" y="85" fill="#00ff00" font-family="Arial" font-weight="bold" font-size="24">= AND!</text>
  
  <!-- Annotation Circles showing cancellation -->
  <circle cx="192" cy="100" r="25" fill="none" stroke="#ff0000" stroke-width="2" stroke-dasharray="4,2"/>
  <circle cx="442" cy="100" r="25" fill="none" stroke="#ff0000" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="170" y1="120" x2="464" y2="80" stroke="#ff0000" stroke-width="2"/>
</svg>